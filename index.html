<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>גיוס, מיון, הצבה וקליטת עובדים — מערכת לימוד</title>
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --ink:#1c2333; --muted:#66708a;
  --brand:#1e5aa8; --brand2:#0e8f7a; --line:#e3e7ef;
  --ok:#0e8f5a; --okbg:#e8f7ef; --bad:#c23a3a; --badbg:#fdeeee;
  --gold:#b07d1e; --goldbg:#fdf6e6; --shadow:0 2px 10px rgba(20,30,60,.07);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151d; --card:#1b202c; --ink:#e8ebf3; --muted:#9aa4bd;
    --brand:#6ea8ee; --brand2:#3fc2a7; --line:#2a3145;
    --ok:#4cc98a; --okbg:#12301f; --bad:#e07070; --badbg:#3a1c1c;
    --gold:#e0b45c; --goldbg:#332913; --shadow:0 2px 10px rgba(0,0,0,.35);
  }
}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px));}
html,body{margin:0;height:100%;}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI","Heebo",Arial,sans-serif;line-height:1.65;}
.hidden{display:none !important;}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;display:flex;align-items:center;gap:12px;padding:12px 16px;box-shadow:var(--shadow);}
.topbar-title{font-weight:700;font-size:1.05rem;}
.topbar-sub{font-weight:400;font-size:.8rem;opacity:.85;}
.menu-btn{display:none;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:1.2rem;border-radius:8px;padding:4px 10px;cursor:pointer;}

.layout{display:flex;min-height:calc(100vh - 120px);}
.sidenav{width:260px;flex-shrink:0;background:var(--card);border-left:1px solid var(--line);padding:14px 10px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--ink);font-size:.93rem;margin-bottom:2px;}
.nav-item:hover{background:var(--bg);}
.nav-item.active{background:var(--brand);color:#fff;font-weight:700;}
.nav-item .nv-badge{margin-inline-start:auto;font-size:.72rem;color:var(--muted);}
.nav-item.active .nv-badge{color:#e8f0ff;}
.nav-home{font-weight:700;border-bottom:1px solid var(--line);margin-bottom:8px;padding-bottom:10px;}

.main{flex:1;padding:22px clamp(14px,3vw,40px);max-width:980px;margin:0 auto;}

.hero{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;border-radius:18px;padding:26px 24px;box-shadow:var(--shadow);margin-bottom:22px;}
.hero h1{margin:0 0 6px;font-size:1.5rem;}
.hero p{margin:0;opacity:.92;font-size:.95rem;}
.hero .hero-stats{margin-top:12px;font-size:.85rem;opacity:.9;}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
.ucard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s;}
.ucard:hover{transform:translateY(-3px);}
.ucard .uc-icon{font-size:1.5rem;}
.ucard h3{margin:8px 0 4px;font-size:1rem;}
.ucard .uc-desc{color:var(--muted);font-size:.82rem;min-height:2.4em;}
.ucard .uc-meta{margin-top:10px;font-size:.78rem;color:var(--brand);font-weight:600;}
.ucard .uc-best{font-size:.75rem;color:var(--ok);font-weight:700;}

.unit-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
.unit-head h2{margin:0;font-size:1.35rem;}
.back-btn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 14px;cursor:pointer;font-size:.85rem;}
.tabs{display:flex;gap:8px;margin:14px 0;}
.tab{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 18px;cursor:pointer;font-size:.88rem;color:var(--ink);}
.tab.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700;}

.summary{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);font-size:.95rem;}
.summary h3{color:var(--brand);margin:20px 0 8px;font-size:1.05rem;border-bottom:2px solid var(--line);padding-bottom:4px;}
.summary h3:first-child{margin-top:0;}
.summary h4{color:var(--brand2);margin:14px 0 6px;font-size:.95rem;}
.summary ul{margin:6px 0;padding-inline-start:20px;}
.summary li{margin-bottom:4px;}
.summary table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.87rem;}
.summary th{background:var(--brand);color:#fff;padding:7px 10px;text-align:right;}
.summary td{border:1px solid var(--line);padding:7px 10px;vertical-align:top;}
.summary tr:nth-child(even) td{background:var(--bg);}
.hl{background:var(--goldbg);border-right:4px solid var(--gold);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:.9rem;}
.hl b:first-child{color:var(--gold);}

.q-progress{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:10;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-bottom:14px;font-size:.85rem;display:flex;justify-content:space-between;box-shadow:var(--shadow);}
.q-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow);}
.q-num{color:var(--brand);font-weight:800;font-size:.8rem;}
.q-exam-badge{display:inline-block;background:var(--goldbg);color:var(--gold);border:1px solid var(--gold);border-radius:999px;font-size:.7rem;font-weight:700;padding:1px 10px;margin-inline-start:8px;vertical-align:middle;}
.q-text{font-weight:600;margin:8px 0 12px;white-space:pre-line;font-size:.95rem;}
.opt{display:block;width:100%;text-align:right;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer;font-size:.9rem;color:var(--ink);font-family:inherit;line-height:1.5;}
.opt:hover{border-color:var(--brand);}
.opt.correct{background:var(--okbg);border-color:var(--ok);font-weight:700;}
.opt.wrong{background:var(--badbg);border-color:var(--bad);}
.opt:disabled{cursor:default;opacity:1;}
.explain{background:var(--bg);border-right:4px solid var(--brand2);border-radius:8px;padding:10px 14px;margin-top:10px;font-size:.87rem;}
.explain .ex-title{font-weight:800;}
.ex-ok .ex-title{color:var(--ok);}
.ex-bad .ex-title{color:var(--bad);}

.result-banner{border-radius:14px;padding:18px 20px;margin:16px 0;text-align:center;font-size:1.05rem;font-weight:700;box-shadow:var(--shadow);}
.result-pass{background:var(--okbg);color:var(--ok);border:1.5px solid var(--ok);}
.result-mid{background:var(--goldbg);color:var(--gold);border:1.5px solid var(--gold);}
.retry-btn{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:10px 22px;cursor:pointer;font-size:.9rem;margin-top:8px;font-family:inherit;}

.foot{display:flex;align-items:center;justify-content:center;gap:12px;padding:18px;border-top:1px solid var(--line);background:var(--card);}
.foot-logo{height:44px;width:auto;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .foot-logo{background:#f4f4f2;border-radius:10px;padding:4px 8px;}
}
.foot-text{font-size:.8rem;color:var(--muted);}

@media (max-width:860px){
  .menu-btn{display:block;}
  .topbar-sub{display:none;}
  .topbar{gap:8px;padding:10px 12px;}
  .topbar-title{font-size:.98rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sidenav{position:fixed;right:0;left:auto;top:0;bottom:0;z-index:100;width:min(280px,82vw);
    transform:translateX(100%);transition:transform .22s ease;
    padding-top:calc(64px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
    overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 0 30px rgba(0,0,0,.35);}
  .sidenav.open{transform:translateX(0);}
  .nav-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;opacity:0;pointer-events:none;transition:opacity .22s;}
  .nav-backdrop.show{opacity:1;pointer-events:auto;}
  .layout{display:block;}
  .main{padding:14px 12px;}
  .exam-bar{top:calc(52px + env(safe-area-inset-top,0px));}
}


:root[data-theme="dark"]{
  --bg:#12151d; --card:#1b202c; --ink:#e8ebf3; --muted:#9aa4bd;
  --brand:#6ea8ee; --brand2:#3fc2a7; --line:#2a3145;
  --ok:#4cc98a; --okbg:#12301f; --bad:#e07070; --badbg:#3a1c1c;
  --gold:#e0b45c; --goldbg:#332913; --shadow:0 2px 10px rgba(0,0,0,.35);
}
:root[data-theme="dark"] .foot-logo{background:#f4f4f2;border-radius:10px;padding:4px 8px;}
.theme-btn{margin-inline-start:auto;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:.85rem;border-radius:999px;padding:6px 14px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.theme-btn:hover{background:rgba(255,255,255,.25);}
.opt.sel{border-color:var(--brand);background:var(--card);box-shadow:0 0 0 2px var(--brand) inset;font-weight:700;}
.exam-bar{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:10;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.88rem;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--shadow);flex-wrap:wrap;}
.submit-btn{background:var(--brand2);color:#fff;border:none;border-radius:10px;padding:9px 22px;cursor:pointer;font-size:.9rem;font-weight:700;font-family:inherit;}
.submit-btn:disabled{opacity:.55;cursor:default;}
.nav-sep{margin:10px 4px 6px;font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.03em;}
.exam-intro{background:var(--goldbg);border:1px solid var(--gold);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:.88rem;}
.result-fail{background:var(--badbg);color:var(--bad);border:1.5px solid var(--bad);}

.print-btn{margin-inline-start:auto;}
.unit-head{flex-wrap:wrap;}

.open-q summary{cursor:pointer;list-style:none;}
.open-q summary::-webkit-details-marker{display:none;}
.open-q summary .q-text{display:inline;}
.open-q summary::before{content:"▸ ";color:var(--brand);font-weight:700;}
.open-q[open] summary::before{content:"▾ ";}

/* --- גיוס ומיון: סימון מקורות --- */
.slide-ref{display:inline-block;font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-inline-start:6px;vertical-align:middle;font-weight:400;}
.student-add{border-inline-start:4px solid var(--brand2);background:var(--card);border-radius:8px;padding:8px 12px;margin:10px 0;}
.student-add::before{content:"📝 תוספת מסיכום הסטודנטית";display:block;font-size:.75rem;font-weight:700;color:var(--brand2);margin-bottom:4px;}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0;}
.tbl-wrap table{margin:0;}
@media (max-width:600px){ .summary table{min-width:520px;} .summary td,.summary th{font-size:.82rem;} }

</style>
</head>
<body>
<header class="topbar">
  <button id="menuBtn" class="menu-btn" aria-label="תפריט">☰</button>
  <div class="topbar-title">👥 גיוס, מיון, הצבה וקליטת עובדים <span class="topbar-sub">· MA · הלוי ליבת חן</span></div>
  <button id="themeBtn" class="theme-btn" aria-label="החלפת מצב תצוגה">🌓 תצוגה</button>
</header>

<div class="layout">
  <div id="navBackdrop" class="nav-backdrop"></div>
  <nav id="sideNav" class="sidenav"><div id="navList"></div></nav>
  <main id="main" class="main">
    <section id="homeView"></section>
    <section id="unitView" class="hidden"></section>
  </main>
</div>

<h3>חלק א׳ — אמת או שקר?</h3>

<h4>"לגייס עובד יותר יקר מאשר לשמר עובד" <span class="slide-ref">שקופיות 1–2</span></h4>
<p><b>אמת.</b></p>
<p><b>עלויות גיוס:</b></p>
<ul>
<li><b>עלויות גיוס ישירות:</b> פרסום מודעות, בדיקות, ראיונות, מבחנים, הצעת שכר ועלויות צוות הגיוס. (ע"פ מחקר של דלויט מ-2022 — בעולם, 4000$ לעובד ובארץ כ-7,000 ₪)</li>
<li><b>עלות הקליטה של עובד או עובדת חדשה:</b> יום אוריינטציה, הדרכות, השקעת זמן מנהלים, חונכים, שירות ארגוני (הכנת מחשב, עמדת עבודה וכדומה). עלות הסעיף הזה מגיעה לפי נתוני Deloitte ל-4,500 שקל (3,000 דולר בעולם).</li>
<li><b>עלות הפגיעה בפרודוקטיביות:</b> כדי שעובד חדש יגיע לפרודוקטיביות של עובד שעבד שנתיים-שלוש בחברה ועזב, צריך לחשב את עלות ההכנסות שהפסידה החברה כשהוא עזב ובזמן שנדרש להכניס את העובד החדש לעניינים (זמן ממוצע — חצי שנה עד שנתיים).</li>
<li><b>עלות הפגיעה במחוברות</b> של העובדים בכל פעם שמישהו עוזב. העזיבה פוגעת במורל ובפרודוקטיביות.</li>
</ul>
<p><b>האיור בשקופית — "העלות של עזיבת עובדים, לפי דרגתם בארגון"</b> (שיעור מתוך השכר השנתי*):</p>
<table>
<tr><th>דרג</th><th>עלות העזיבה (% מהשכר השנתי)</th></tr>
<tr><td>בכירים</td><td>200%–400%</td></tr>
<tr><td>דרג ביניים</td><td>100%–150%</td></tr>
<tr><td>זוטרים</td><td>20%–30%</td></tr>
</table>
<p style="font-size:.85rem">*החישוב כולל עלויות גיוס וקליטה ישירות, אובדן פרודוקטיביות ואובדן ידע; הוא אינו כולל את שכר העובד המחליף שעשוי להיות גבוה יותר.</p>

<h4>"עובדים מבוגרים עולים יותר ואינם מוסיפים ערך" <span class="slide-ref">שקופיות 3–4</span></h4>
<p><b>שקר.</b></p>
<p><b>במחקר של חברת הייעוץ התעסוקתי מרסר, נמצא ש...</b></p>
<ul>
<li>עובדים מבוגרים מביאים עמם רובד נוסף של אינטליגנציה רגשית למקום העבודה</li>
<li>עובדים מבוגרים מפחיתים עלויות כיוון שהם נוטים פחות לעזוב מרצונם, ובעלי שיעורי תחלופה נמוכים יותר בצוותים שהם מפקחים עליהם</li>
<li>לעובדים מבוגרים יש חשיבות מכרעת ביצירת סביבת עבודה של שיתוף ידע והדרכה, ומחקרים מצביעים על כך שנוכחותם מחזקת את הלכידות הקבוצתית, שיתוף הפעולה והחוסן</li>
<li>בעשור האחרון חלה עלייה <b>באימוץ טכנולוגיות</b> מפתח על ידי אנשים בקבוצות הגיל המבוגרות ביותר. מבוגרים רוצים ללמוד טכנולוגיות חדשות, בדיוק כמו בני דורות אחרים.</li>
</ul>

<h4>שאלה לגיטימית בראיון עבודה: "מה עושה בעלך?" <span class="slide-ref">שקופיות 5–6</span></h4>
<p><b>שקר.</b></p>
<ul>
<li><b>לפי החוק בישראל אסור להפלות מועמדים לעבודה על בסיס מין, נטייה מינית, מעמד אישי, הריון, גיל, הורות, לאום, ארץ מוצא, דת, השקפה, תמיכה במפלגה או שירות מילואים.</b></li>
<li>גם שאלות תמימות לכאורה כמו "איך את אוהבת לבלות את אחר-הצהריים שלך?" או "בעלך גם עובד במשרה מלאה?" עלולות לחשוף דעות קדומות ולגרום באופן עקיף לאפליה.</li>
</ul>

<h4>"עובדים שהגיעו דרך 'חבר מביא חבר' נשארו יותר זמן בארגון לעומת מקורות גיוס אחרים" <span class="slide-ref">שקופיות 7–8</span></h4>
<p><b>אמת.</b></p>

<h4>"המועמד האידיאלי קיים ואנחנו רק צריכים למצוא אותו" <span class="slide-ref">שקופיות 9–10</span></h4>
<p><b>שקר.</b></p>
<p><b>האמת:</b> גיוס הוא תהליך של ניהול פשרות (Trade-offs). לעיתים קרובות עדיף לגייס מישהו עם פוטנציאל למידה גבוה ו"התאמה תרבותית" מצוינת, מאשר את האדם עם הטכנולוגיה המדויקת אך עם פערי תקשורת או מוטיבציה.</p>

<h4>"גיוס זה בעיקר לסנן את הלא מתאימים" <span class="slide-ref">שקופית 11</span></h4>
<p><i>במצגת מופיעה הטענה בלבד, ללא שקופית תשובה.</i></p>
<div class="student-add">"גיוס זה בעיקר לסנן את הלא מתאימים" — <b>אמת.</b></div>

<h4>"תואר אקדמי הוא האינדיקטור הטוב ביותר להצלחה עתידית" <span class="slide-ref">שקופיות 12–13</span></h4>
<p><b>שקר.</b></p>
<p><b>האמת:</b> במקרים רבים, כישורים רכים (Soft Skills), יכולת פתרון בעיות, והסתגלות לשינויים (Agility) מנבאים הצלחה הרבה יותר טוב מאשר תעודה או שם של מוסד לימודים.</p>

<h3>חלק ג׳ — גיוס</h3>

<div class="hl"><b>גיוס</b> <span class="slide-ref">שקופית 20</span><br>תהליך אשר בסיומו מוצב בתפקיד נתון ובארגון נתון העובד המתאים ביותר, בזמן המתאים ביותר, ובעלות הנמוכה ביותר.</div>

<li>גם שהעובד יהיה מתאים, גם בזמן סביר ובעלות סבירה — משמע תהליך של גיוס מוצלח.</li>
<li>ככל שנהיה מדויקים יותר — מעגל צר של מועמדים ולא רחב.</li>

<h4>תהליך גיוס עובדים <span class="slide-ref">שקופית 21</span></h4>
<ul>
<li>זיהוי עובדים או מועמדים פוטנציאליים וגיוסם לעבודה</li>
<li>תהליך אשר בסיומו מוצב בתפקיד נתון ובארגון נתון העובד המתאים ביותר, בזמן המתאים ביותר, ובעלות הנמוכה ביותר</li>
<li>מטרות תהליך <u>תכנון תהליך גיוס</u> הן: להבטיח שתהיה היענות מספקת (ולא גדולה מדי) של מועמדים למשרה, שהפונים יתאימו לדרישות המשרה ושיש סבירות גבוהה לאיוש המשרה</li>
</ul>
<p><b>שלבי התהליך (תרשים זרימה):</b></p>
<p>זיהוי תפקיד פנוי ← ציון דרישות תפקיד וכישורים ← בחירת שיטת גיוס מתאימה ← יצירת מאגר מועמדים מתאימים</p>

{unit:2, q:"חיזוי TOP-DOWN זה אומר:", options:["העובדים מציפים תחזיות כ\"א","המנהלים מציפים תחזיות כ\"א לשנה הקרובה","שוק העבודה מכתיב את החיזוי של כ\"א לארגונים","אף תשובה לא נכונה"], answer:1, explain:"ב-TOP-DOWN התחזית מגיעה \"מלמעלה\" — המנהלים מציפים את צורכי כוח האדם. במצגת 2 (שקופית 6): שיח עם מנהלים לבניית תחזיות ביקוש והיצע. ⚠️ המונח TOP-DOWN עצמו לא מופיע במצגות; התשובה לפי מפתח המבחן."},
{unit:2, q:"כאשר חברה מחליטה לגייס עובדים חדשים במסגרת תכנון משאבי אנוש המשמעות הינה:", options:["ביקוש גבוה לכ\"א","ביקוש נמוך לכ\"א","היצע פנימי זהה לביקוש","היצע פנימי גבוה"], answer:0, explain:"כאשר הביקוש עולה על ההיצע (מחסור בעובדים), ארגונים מגדילים: גיוס עובדים, העסקה זמנית, מיקור חוץ (מצגת 2, שקופית 4)."},
{unit:2, q:"כאשר ארגון מחליט לגייס עובדים חדשים מבחוץ, מהו המצב בארגון?", options:["הביקוש גדול מההיצע הפנימי","ההיצע הפנימי גדול מהביקוש","המצב דורש גם גיוס לפרויקטים זמניים","מומלץ לארגון לפנות לגיוס ע\"י קבלן חיצוני"], answer:0, explain:"גיוס מבחוץ = אין בארגון מספיק עובדים לאייש את הצורך, כלומר הביקוש גדול מההיצע הפנימי (מצגת 2, שקופית 4). ⚠️ לשאלה הזו אין תשובה במפתח המבחן (מספור כפול במבחן); התשובה נקבעה לפי המצגת."},
{unit:2, q:"לפניך שני משפטים:\nמשפט 1: כאשר חברה מחליטה לגייס עובדים לאחר שבוצע תכנון משאבי אנוש המשמעות הינה מחסור בעובדים\nמשפט 2: כאשר חברה מאחדת תפקידים ומפטרת אנשים משמעות הדבר היא עודף היצע פנימי", options:["משפט 1 לא נכון, משפט 2 נכון","שני המשפטים לא נכונים","שני המשפטים נכונים","משפט 1 נכון, משפט 2 לא נכון"], answer:2, explain:"משפט 1: גיוס = הביקוש עולה על ההיצע = מחסור בעובדים — נכון. משפט 2: איחוד תפקידים ופיטורים = צמצום, שנעשה כשההיצע עולה על הביקוש (עודף עובדים) — נכון (מצגת 2, שקופית 4)."},
{unit:2, q:"ביקוש נמוך לעובדים משמעו:", options:["הארגון לא צריך הרבה עובדים","הארגון צריך עובדים רבים","מחלקת משאבי אנוש לא אוהבת לגייס","מחלקת משאבי אנוש לא משקיעה במיון עובדים מקצועי"], answer:0, explain:"ביקוש = כמה עובדים הארגון צריך. ביקוש נמוך = הארגון לא צריך הרבה עובדים (מצגת 2, שקופית 4)."},
{unit:2, q:"חברת ממתקים הנמצאת בעודף היצע כוח אדם — סביר כי תפעל באופן הבא:", options:["תקצץ את השעות הנוספות ב-30%","תעכב יציאת עובדים לגמלאות","תרחיב העסקת קבלני משנה","תנסה בכל דרך למשוך עובדים איכותיים נוספים לשורותיה"], answer:0, explain:"עודף היצע = יותר עובדים ממה שצריך ← צמצום. \"הפחתת שעות נוספות\" מופיעה ברשימת דרכי הצמצום (מצגת 2, שקופית 7). שאר התשובות מגדילות כוח אדם — מתאימות למחסור."},
{unit:2, q:"כאשר מודיעים לעובדים על חופש כפוי בן שבוע, ניתן להניח שבחברה יש כעת:", options:["עודף היצע","עודף ביקוש","עודף בימי חופשה","רצון להפחית לחץ אצל העובדים"], answer:0, explain:"חופשה כפויה היא דרך צמצום, שמשמשת כשההיצע עולה על הביקוש (מצגת 2, שקופיות 4 ו-7)."},
{unit:2, q:"מנהל המחלקה כינס את עובדי המחלקה וציין כי בשל המצב בחברה הוחלט לחייבם לצאת לחופשה של שבוע ולאחריה כל עובד יממש בכל שבוע יום חופש ממכסת ימי החופשה שלו. בהנחה שמכסת ימי החופש עומדת בחוק, על מה מעידה פעולת המנהל?", options:["עודף ביקוש","עודף בימי חופשה","רצון להפחית לחץ אצל העובדים","עודף היצע"], answer:3, explain:"חופשה כפויה והפחתת ימי עבודה הן דרכי צמצום, שמשמשות כשההיצע עולה על הביקוש — עודף עובדים (מצגת 2, שקופיות 4 ו-7)."},
{unit:2, q:"בארגון הפועל בשוק תחרותי חלה ירידה בהיקף הפעילות העסקית. כתוצאה מכך, מחלקת משאבי האנוש נאלצת לפתור בעיה של עודף של עובדים. אחת הדרכים שמחלקת משאבי האנוש תציע לפתרון היא:", options:["לפטר עובדים","יש להגביר את כמות ההדרכה של העובדים","יש להגביר את כמות החונכות לעובדים נבחרים","יש להפחית את תחלופת העובדים"], answer:0, explain:"פיטורין היא אחת מדרכי הצמצום בעודף עובדים (מצגת 2, שקופיות 4 ו-7). הדרכה וחונכות לא פותרות עודף, והפחתת תחלופה אף מגדילה אותו."},
{unit:2, q:"מפעל לייצור גלידות פנה לעובדיו בבקשה להירתם לעבודה בשעות נוספות במהלך חודשי הקיץ. מנתון זה ניתן להסיק כי במפעל קיים כעת:", options:["עודף היצע של כוח אדם","ביקוש של כוח אדם","בקשה לא חוקית של המנהלים","רצון להפחית את העומס בעבודה"], answer:1, explain:"בקשה לשעות נוספות מעידה שצריך יותר עבודה ממה שהעובדים הקיימים מספקים — ביקוש לכוח אדם. בעודף היצע עושים את ההפך: מפחיתים שעות נוספות (מצגת 2, שקופית 7)."},
{unit:2, q:"ארגון חווה עודף כוח אדם מבני בשל צמצום מוצרים. איזה מהתהליכים הבאים מהווה את האסטרטגיה הניהולית הנכונה ביותר לטווח הארוך לצמצום הפער?", options:["הגדלת שעות העבודה והיקף שעות נוספות לכלל המחלקות","הוספת משרות חדשות בדרג הביניים","שילוב בין תוכניות פרישה מרצון והקפאת גיוסים רוחבית","פיטורים מיידיים של כל העובדים בעלי הוותק הנמוך ביותר ללא בדיקת כישורים"], answer:2, explain:"הקפאת גיוסים ותוכניות פרישה מוקדמת הן דרכי צמצום (מצגת 2, שקופית 7). פיטורים \"ללא בדיקת כישורים\" פוגעים — חסרון של צמצום הוא \"קיצוץ בכישורים המקצועיים העומדים לרשות הארגון\" (שקופית 8)."},
{unit:2, q:"חברת תקשורת הכניסה מערכת בינה מלאכותית (AI) שמטפלת אוטומטית ב-60% מפניות לקוחות החברה. מה צפוי לקרות לצורכי כוח האדם בחברה?", options:["הביקוש לנציגי שירות לקוחות בחברה יפחת בעוד שהביקוש למשרות תמיכה טכנולוגית יגדל","מספר המועמדים לתפקידי שירות לקוחות בכל שוק העבודה יקטן מידית","החברה תצטרך להגדיל את כוח האדם בחברה בכל התפקידים בגלל שיפור הטכנולוגיה","לא יהיה שינוי בתכנון כוח האדם בחברה"], answer:0, explain:"ניתוח הגורמים הטכנולוגיים (PEST): אוטומציה וקצב השינוי הטכנולוגי משפיעים על העלויות ועל הצורך בעובדים (מצגת 2, שקופית 5). הביקוש משתנה בתוך החברה: פחות נציגים, יותר תמיכה טכנולוגית."},
{unit:2, q:"מה נכון ביחס לתכנון משאבי אנוש?", options:["כל המשפטים אינם נכונים","תכנון משאבי אנוש מתבצע ע\"י אנשי משאבי אנוש ללא שיתוף המנהלים הישירים","תכנון משאבי אנוש נעשה תמיד ע\"י גורמים חיצוניים לארגון שמייעצים למחלקת משאבי אנוש","תכנון משאבי אנוש הוא תהליך שאינו תורם לאפקטיביות הארגונית"], answer:0, explain:"ב' שגוי — התכנון כולל שיח עם מנהלים (מצגת 2, שקופית 6). ג' שגוי — \"תמיד\" ו\"חיצוניים\". ד' שגוי — התכנון נועד להבטיח שהארגון יעמוד ברמה הנדרשת של עובדים להשגת יעדיו (שקופית 2)."},
{unit:2, q:"מה נכון בנוגע לתכנון משא\"ן?", options:["זהו תהליך בו מתבצע שיפור של שיטות ושל תהליכי עבודה","זהו תהליך יעיל התורם לאפקטיביות הארגונית","מטרתו הינה לספק לארגון את השילוב הנכון והאופטימלי בין עובדים לבין עולם העבודה","זהו תהליך שמטרתו הינה לתכנן את תהליך העבודה באופן יעיל, כך שלא ייווצרו בו \"צווארי בקבוק\""], answer:1, explain:"תכנון המשאב האנושי מבטיח שלארגון יהיו עובדים בעלי המיומנויות המתאימות להשגת יעדיו (מצגת 2, שקופית 2), ולכן תורם לאפקטיביות הארגונית. \"שיפור שיטות ותהליכי עבודה\" הוא שימוש של ניתוח עיסוקים (שקופית 11)."},
{unit:2, q:"מה נכון בנוגע לניהול אסטרטגי של משאבי אנוש?", options:["האופן בו יארגן וינהל הארגון את המשאב האנושי כך שמטרותיו העסקיות תושגנה בצורה חלקית בלבד","פיתוח והטמעה של תכניות שאינן מקשרות בין ניהול משאבי אנוש לבין יעדי הארגון","פיתוח והטמעה של תכניות המקשרות ביעילות בין ניהול משאבי אנוש לבין יעדי הארגון","כל התשובות נכונות"], answer:2, explain:"התכנון נעשה \"בהתאם לתחזיות ולאסטרטגיה\" (מצגת 2, שקופית 4), ובתרשים מופיע שלב \"בניית אסטרטגיית משאבי אנוש\" (שקופית 3). ניהול אסטרטגי מקשר בין משאבי האנוש ליעדי הארגון."},
{unit:2, q:"בביצוע ניתוח עיסוקים בארגון המליץ יועץ ארגוני למנהל משאבי אנוש:", options:["הסתמך על העובד ושאל אותו שאלות לגבי העיסוק","כדאי לבצע תצפית כדי ללמוד על העיסוק","יש לבדוק יומני פעילות בתפקיד","כל התשובות נכונות"], answer:3, explain:"איסוף מידע בניתוח עיסוקים: תצפיות, שיח עם מנהלים ועובדים, ושאלון (מצגת 2, שקופית 13). שילוב של כמה שיטות נותן תמונה מלאה."},
{unit:2, q:"מהי הדרך המומלצת לאיסוף מידע מקיף ומדויק בעת ביצוע ניתוח עיסוקים בארגון?", options:["קיום ראיונות ושאלונים מול העובד המבצע את התפקיד","ביצוע תצפיות ישירות על אופן ביצוע העבודה בפועל","איסוף נתונים והגדרות מבעלי התפקידים הניהוליים","שילוב של כל השיטות הללו יחד"], answer:3, explain:"איסוף מידע בניתוח עיסוקים: תצפיות, שיח עם מנהלים ועובדים, ושאלון (מצגת 2, שקופית 13). השילוב נותן את התמונה המקיפה והמדויקת ביותר."},
{unit:2, q:"ניתוח עיסוקים בארגונים אינו משמש ל:", options:["העלאת שכר","שיפור שיטות ותהליכי עבודה","תכנון מסלולי קידום","קביעת דירוגי שכר"], answer:0, explain:"בשימושי ניתוח עיסוקים מופיעה \"קביעת דירוג שכר\" — לא \"העלאת שכר\" לעובד (מצגת 2, שקופית 11). שיפור תהליכי עבודה ומסלולי קידום גם הם ברשימה."},
{unit:2, q:"דנה היא מנהלת משאבי אנוש בחברת ביטוח גדולה. כחלק מתפקידה, היא משתמשת בניתוח עיסוקים כדי לשרטט מפה הקובעת סולמות עיסוקים או מסלולים באמצעותם עובדי החברה יכולים להתקדם בו. דנה משתמשת בניתוח עיסוקים לצורך:", options:["תכנון מסלולי קידום","תכנון עובדים וניודם","הכוונה, השמה והסבה מקצועית","הערכת ביצועי עובדים"], answer:0, explain:"\"סולמות עיסוקים או מסלולים שבהם העובדים יכולים להתקדם\" = תכנון מסלולי קידום, אחד משימושי ניתוח העיסוקים (מצגת 2, שקופית 11)."},
{unit:2, q:"לפניך חלק ממודעת דרושים: \"מחלקת משאבי אנוש באמדוקס מחפשת מועמדים.ות לתפקיד HR Leader. במסגרת התפקיד: הובלת תהליכי פיתוח עובדים; עיצוב התרבות הארגונית; סיוע בפיתוח ארגוני; השתתפות בדיונים על האסטרטגיה העסקית ועיצובה.\" המתואר במודעה הנו דוגמא ל:", options:["תיאור עיסוק","יסוד (element)","דרישות עיסוק","תיאור עיסוק ודרישות עיסוק"], answer:0, explain:"המודעה מתארת מה עושים בתפקיד — מטלות ותחומי אחריות = תיאור תפקיד (מצגת 2, שקופית 14). אין בה דרישות: ניסיון, השכלה, כישורים (שקופית 16)."},
{unit:2, q:"תמחיר של תהליכים ומוצרים; פיקוח על הנהלת החשבונות; עריכת התקציב ובקרה על \"תכנון מול ביצוע\"; עריכת הדוחות הכספיים השנתיים של הארגון — הינם _________ בניתוח עיסוק של חשב כספים.", options:["יסוד (element)","מטלה (task)","עיסוק (job)","תת מטלה (sub-task)"], answer:1, explain:"לפי מפתח המבחן — מטלה (task): פעולה שלמה שהעובד מבצע במסגרת העיסוק. ⚠️ המדרג יסוד / תת-מטלה / מטלה / עיסוק לא מופיע במצגות; במצגת 2 (שקופית 14) מופיעה רק \"הגדרת מטלות\" כחלק מתיאור התפקיד."},
{unit:2, q:"בנוגע להבחנה בין עיסוק למשרה / תפקיד, יהיה נכון לטעון כי בבית-חולים, \"אחות\" מדגים ______ ואילו אחות טיפול נמרץ, אחות מחלקת ילדים, אחות חדר ניתוח מדגים ______.", options:["משרה / תפקיד; עיסוק","עיסוק; משרה / תפקיד"], answer:1, explain:"לפי מפתח המבחן: \"אחות\" היא העיסוק הכללי, וכל אחות במחלקה מסוימת היא משרה / תפקיד ספציפי. ⚠️ ההבחנה בין עיסוק למשרה לא מופיעה במצגות."},
{unit:2, q:"חברת \"שטראוס עלית\" קיבלה 200 מועמדים לתפקיד של מנהל מותג לאחר שפרסמה מודעה באתר לינקדאין. כמות המועמדים שקיבלה החברה מהווה מדד לאפקטיביות של:", options:["מקור הגיוס","מנהל המכירות","הנהלת הארגון","המועמדים לתפקיד"], answer:0, explain:"כמות הפניות מודדת כמה הערוץ (לינקדאין) הצליח לחשוף ולהביא מועמדים — אפקטיביות מקור הגיוס. בחירת ערוץ הפרסום — מצגת 2, שקופית 20."},
{unit:2, q:"חברה פרסמה משרה בלינקדאין ובמודעת דרושים בעיתון. בלינקדאין התקבל מספר רב של קורות חיים לעומת מעט מהמודעה בעיתון. מה מראה כמות הפניות הגבוהה בלינקדאין?", options:["שהגדרת העיסוק הייתה מוצלחת וממוקדת","איכות גבוהה ומוכחת של המועמדים","תוקף ניבוי גבוה של כלי הסינון","אפקטיביות ערוץ הגיוס, רק מבחינת חשיפה והיקף תפוצה"], answer:3, explain:"כמות פניות לא מעידה על איכות המועמדים, רק על החשיפה של הערוץ. איכות הגיוס נמדדת אחרת: שימור, הערכת ביצועים ושביעות רצון המנהל (מצגת 3, שקופית 17)."},
{unit:2, q:"חברת טכנולוגיה בינונית מעוניינת לגייס סמנכ\"ל בכיר ממתחרה, במינימום חשיפה ובדיסקרטיות מוחלטת. איזה ערוץ גיוס הוא המתאים ביותר לגיוס זה?", options:["פרסום המשרה בלינקדאין ואתרי דרושים","פנייה ישירה וחסויה למועמדים רלוונטיים","פנייה פתוחה בפורומים מקצועיים ובקבוצות מנהלים","קמפיין \"חבר מביא חבר\" בקרב עובדי החברה"], answer:1, explain:"ערוץ אקטיבי (Outbound): פנייה יזומה, Headhunting (מצגת 2, שקופית 20). שאר האפשרויות פומביות ולא שומרות על דיסקרטיות (מצגת 4, שקופית 8)."},
{unit:2, q:"מדוע פנייה ישירה וחסויה (Headhunting / Executive Search) נחשבת לכלי הבלעדי והאפקטיבי ביותר לאיוש משרות הנהלה בכירות במיוחד?", options:["מפני שהחוק מחייב לפרסם משרות ניהול בכירות אך ורק באמצעות חברות השמה חיצוניות","מפני שמבחני מיון קוגניטיביים המוניים אינם חוקיים עבור מנהלים","משום שזו הדרך הזולה ביותר שאינה דורשת עמלות או משאבי זמן ניהוליים","משום שבגיוס למשרות אלו נדרשת דיסקרטיות מוחלטת"], answer:3, explain:"דיסקרטיות מגינה על המועמד מפגיעה במקום עבודתו הנוכחי ועל הארגון מחשיפה (מצגת 4, שקופית 8). Headhunting הוא ערוץ אקטיבי (מצגת 2, שקופית 20)."},

/* ===== מצגת 3 ===== */
{unit:3, q:"ענת, מנהלת משאבי אנוש בחברת XYZ אמרה: \"אנחנו מקבלים עובדים שהם טובים ומתאימים לנו, ללא קשר לגילם\". דבריה מעידים על:", options:["היעדר Ageism (גילנות) בארגון","ניהול גיוון = העסקה מכל הסקטורים","התייחסות הולמת של החברה להיצע פנימי של עובדים","מיתוג מעסיק נמוך"], answer:0, explain:"גילנות = דעות קדומות כלפי אדם בהקשר לגילו (מצגת 3, שקופית 4). קבלת עובדים \"ללא קשר לגילם\" = היעדר גילנות."},
{unit:3, q:"אילו מדדים הם המתאימים והמהימנים ביותר להוכחת אפקטיביות ואיכות הגיוס?", options:["שכר היסוד שנסגר + חוויית מועמד","בונוס רכז הגיוס + הערכת הביצועים של המנהל המגייס","מספר המועמדים הכולל שהציעו מועמדות לתפקיד + תקציב הגיוס שהוקצה","משך הזמן לאיוש המשרה + שיעור שביעות הרצון מהעובד שנקלט בחברה"], answer:3, explain:"Time to Hire (זמן לאיוש) הוא המדד הקלאסי ליעילות; Manager Satisfaction (שביעות רצון המנהל המגייס מהעובד) הוא חלק מאיכות הגיוס, המדד החשוב ביותר (מצגת 3, שקופיות 16–17)."},

/* ===== מצגת 4 ===== */
{unit:4, q:"מנהלת משאבי אנוש בחברת \"ויסוניק טייקו\" החליטה לראיין מועמדים יחד עם מנהל השיווק בחברה. שני המשפטים הבאים מתייחסים להחלטה זו:\nמשפט 1: ראיון בצוות של שני מראיינים יפגע באחידות של הראיונות.\nמשפט 2: ראיון בצוות של שני מראיינים יסרבל את תהליך המיון.\nבחר את התשובה הנכונה ביותר:", options:["שני המשפטים אינם נכונים","משפט 1 נכון, משפט 2 לא נכון","שני המשפטים נכונים","משפט 2 נכון, משפט 1 לא נכון"], answer:0, explain:"לפי מפתח המבחן — שני המשפטים אינם נכונים: ראיון בצוות לא פוגע באחידות ולא מסרבל את המיון. ⚠️ ראיון בצוות לא מוסבר במצגות; במצגת 3 (שקופית 9) מופיע \"פאנל מראיינים מגוון\" ככלי לגיוון, ובמצגת 5 (שקופית 11) \"מספר מעריכים\" כיתרון של מרכז הערכה."},
{unit:4, q:"איזה מן הבאים אינו נתון שמותר על פי החוק בישראל לאסוף מן המועמד במהלך תהליכי גיוס ומיון של עובדים חדשים?", options:["פרופיל צבאי","מידע על מקומות עבודה קודמים","קרבתו לבעלי הארגון","מספר בעלי החיים שלו"], answer:0, explain:"\"פרופיל צבאי\" מופיע ברשימת \"מה לא לשאול בראיון עבודה\" לפי חוק שוויון ההזדמנויות בעבודה (מצגת 4, שקופית 4)."},
{unit:4, q:"על פי פסיקת בתי הדין לעבודה וחוק שוויון הזדמנויות בעבודה, מהו הסטטוס המשפטי של שאלות הנוגעות לשירות מילואים פעיל במהלך ראיון עבודה?", options:["מותרת אך ורק בחברות הביטחוניות והממשלתיות","שאלה חובה בכל ראיון לצורך הערכת פניות העובד למשימות חירום ארגוניות","שאלה העלולה ליצור חשיפה לתביעה בגין אפליה אסורה","מותרת לחלוטין ומהווה מדד הכרחי להערכת מוסר עבודה צבאי"], answer:2, explain:"החוק אוסר להפלות מחמת שירות במילואים, וברשימת \"מה לא לשאול\" מופיעים משך שירות המילואים, קריאה לשירות ושירות צפוי (מצגת 4, שקופית 4)."},
{unit:4, q:"במהלך ראיון עבודה לתפקיד מנהלת שיווק בחברת הייטק, שאל המראיין את המועמדת כיצד היא תתמודד עם תפקיד ניהולי תובעני כאשר יש לה 3 ילדים קטנים. המועמדת לא התקבלה לתפקיד ותבעה את החברה בגין אפליה. מהי הקביעה המשפטית הנכונה במקרה זה, לפי חוק שוויון הזדמנויות בעבודה?", options:["השאלה אסורה, עצם הצגת השאלה מהווה ראיה לאפליה מחמת הורות","השאלה מותרת, מכיוון שהיא בדקה את יכולת המועמדת לעמוד בדרישות השעות של התפקיד","השאלה אסורה מפני שהמועמדת יכולה להשיב שלא תסתדר בעבודה","השאלה מותרת, בתנאי שהמעסיק שאל את אותה השאלה למועמדים גברים בעלי ילדים"], answer:0, explain:"\"כמה ילדים יש לך?\" היא שאלה אסורה; במקומה מותר לשאול \"האם את/ה פנוי/ה לעבודה בשעות הנדרשות?\". בפסק הדין מהמצגת נקבע שעצם העלאת שאלה כזו מהווה \"הפלייה עקיפה\" (מצגת 4, שקופית 5)."},
{unit:4, q:"מהי ההנחה המרכזית העומדת בבסיס השימוש בראיון התנהגותי מובנה בתהליך המיון?", options:["הנחת היסוד שלו היא שהתנהגות שהתרחשה בעבר ניתנת להשלכה על תפקוד עתידי","שפת הגוף והרושם הראשוני של המועמד הם המדד המדויק ביותר להצלחתו","ראיון זה נועד לבדוק בעיקר את הידע התיאורטי של המועמד","ככל שהראיון מכוון למועמד כך תוקף הניבוי שלו עולה"], answer:0, explain:"בגוף הראיון: \"שאלות התנהגותיות ודוגמאות\" על התפקיד האחרון (מצגת 4, שקופית 3). ההנחה: מה שאדם עשה בעבר מנבא מה יעשה בעתיד. \"רושם ראשוני\" הוא דווקא הטיה — ראשוניות (שקופית 7)."},
{unit:4, q:"מה קובע החוק בישראל לגבי חובת המעסיק למסור הודעה למועמד שלא התקבל לתפקיד?", options:["אין חובה חוקית להודיע, יש להודיע רק אם נפגש פיזית עם אחד מנציגי החברה","חובה להודיע לאחר חודשיים מיום תחילת המיון או שבועיים מקבלת אדם אחר למשרה","חובה להודיע לאחר חודש מיום תחילת המיון או יממה מקבלת אדם אחר למשרה","חובה להודיע למועמד רק אם הוא התמיין לחברה בינלאומית"], answer:1, explain:"לפי מפתח המבחן. ⚠️ חובת ההודעה למועמד שלא התקבל לא מופיעה במצגות. במצגת 3 (שקופית 13): \"כנות ושקיפות — ליידע את המועמדים בתוצאות השלבים השונים... גם אם הבשורה אינה טובה\"."},
{unit:4, q:"מראיין בארגון פועל תחת אפקט ההילה (Halo Effect) בעת הערכת מועמד לתפקיד ניהולי. כיצד תבוא לידי ביטוי הטיה זו בפועל?", options:["המראיין יתרשם לטובה מתכונה בולטת אחת של המועמד (כגון כריזמה או הופעה חיצונית מרשימה), וישליך אותה באופן גורף על כל שאר כישוריו, גם ללא בסיס עובדתי","המראיין ייטה להעניק ציונים בינוניים וממוצעים לכל המועמדים כדי להימנע ממתן ציונים קיצוניים לכאן או לכאן","המראיין יושפע בעיקר מהרושם השלילי הראשוני שהותיר המועמד בשניות הראשונות של הראיון ויפסול אותו מיד","המראיין ישווה את המועמד הנוכחי למועמד המצטיין ביותר שראיין לפניו, ובשל כך ימעיט בערכו"], answer:0, explain:"אפקט ההילה: תכונה אחת צובעת את כל התמונה (מצגת 4, שקופית 6). ג' מתאר ראשוניות (שקופית 7), ד' מתאר את אפקט ההשוואה (שקופית 6)."},
{unit:4, q:"מראיין נדרש להעריך שורת מועמדים ביום מרכז הערכה. המועמד הראשון שהתראיין היה בעל יכולות נמוכות במיוחד. בשל כך, המועמד השני שהתראיין מיד אחריו, שהוא בעל יכולות ממוצעות לחלוטין, קיבל ציוני הערכה גבוהים בהרגשה שהיה \"מבריק\". איזו הטיה קוגניטיבית התרחשה במקרה זה?", options:["אפקט ההשוואה","ראשוניות ואחרוניות","הטיית הדמיון","לא התרחשה הטיה, המועמד השני מתאים"], answer:0, explain:"אפקט ההשוואה (Contrast Effect): הערכה ביחס לאנשים אחרים ולא ביחס לדרישות התפקיד (מצגת 4, שקופית 6)."},

/* ===== מצגת 5 ===== */
{unit:5, q:"מהי העמדה המקובלת בספרות המקצועית ובמחקר לגבי השימוש בגרפולוגיה ככלי למיון עובדים?", options:["מדובר בכלי מיון בעל תוקף ניבוי נמוך אשר אינו מומלץ לשימוש כמדד יחיד להצלחה בתפקיד","מדובר בכלי טוב לחיזוי ביצועים בעבודה, היות ומספק עדות לתכונות אישיות של המועמד","מדובר בכלי המיועד לבחינת המיומנויות הטכניות והידע המקצועי של המועמד","מדובר בכלי חובה על פי חוק שוויון הזדמנויות בעבודה לצורך הערכת יושרה"], answer:0, explain:"לגרפולוגיה תוקף ניבוי נמוך לגבי הצלחה בעבודה, מהימנות נמוכה, ובקהילה המדעית היא נחשבת לרוב מדע פסאודו (מצגת 5, שקופית 4)."},
{unit:5, q:"התוקף של ראיון התנהגותי גבוה מהתוקף של ______________", options:["פוליגרף","מבדקי עבודה","גרפולוגיה","כל התשובות נכונות"], answer:3, explain:"לפי מפתח המבחן — כל התשובות נכונות. במצגת 5 (שקופית 4): לגרפולוגיה תוקף ניבוי נמוך. ⚠️ השוואת התוקף לפוליגרף ולמבדקי עבודה לא מופיעה במצגות (ובשקופית 14 דווקא \"משימות סימולציה\" מומלצות) — זו תשובה שכדאי לזכור לפי המפתח."},
{unit:5, q:"השתתפות של מועמדים במרכז הערכה הכולל דינמיקה קבוצתית ומבחני כישורים, מהווה כלי מרכזי ל:", options:["גיוס עובדים","מיון עובדים","קליטת עובדים","שימור עובדים"], answer:1, explain:"יום / מרכז הערכה מופיע ברשימת \"מבחני קבלה לעבודה\" — כלי מיון (מצגת 5, שקופיות 2 ו-7)."},
{unit:5, q:"מדוע מרכזי הערכה המשלבים סימולציות ודינמיקה קבוצתית נחשבים לכלי מיון בעל תוקף הניבוי הגבוה ביותר במחקר הארגוני?", options:["מפני שהם נמשכים ימים ספורים ולכן מנפים אוטומטית מועמדים שאינם סבלניים","מכיוון שהם מדמים את סיטואציות העבודה האמיתיות ומעריכים התנהגויות בפועל באמצעות מגוון מטלות","מפני שהם אינם דורשים שום הכשרה מוקדמת למעריכים המשתתפים בהם","מפני שהם מבוססים על ראיונות אישיים וידוע שלראיון יש תוקף גבוה"], answer:1, explain:"מרכז הערכה כולל מגוון מבחנים (מבחני מצב, דינמיקה קבוצתית, דואר נכנס) ומתבסס על ניתוח העיסוק, ולכן התוקף גבוה (מצגת 5, שקופיות 7 ו-11). ג' שגוי — חסרון של מרכז הערכה הוא \"צורך במיומנות גבוהה\"."},
{unit:5, q:"מהי המטרה המרכזית של שלב בדיקת ממליצים בתהליך המיון והקבלה לעבודה?", options:["לאמת את הנתונים שנמסרו על ידי המועמד וללמוד על דפוסי תפקודו והתנהגותו בעבר","לבחון את רמת האינטליגנציה והיכולות הקוגניטיביות של המועמד באמצעות גורם שלישי","לקבל אישור משפטי לקבלת העובד לעבודה","להחליף את הראיון האישי בתהליך קצר וזול יותר לקבלת החלטה"], answer:0, explain:"הצלבת דוגמאות ונתונים בין הראיון לראיון הממליצים = בדיקת אמינות ומהימנות המועמד (מצגת 5, שקופית 6)."},
{unit:5, q:"כאשר לכלי תוקף נמוך באופן גורף, הדבר מצביע על:", options:["הכלי לא מודד את מה שאמור למדוד","אין התאמה בתוצאות בין מעריכים","אין התאמה בין מדידה בזמן מסוים למדידת אותו המועמד בזמן אחר","אין לתוקף משמעות מהימנות מספיקה לשם שימוש בכלי"], answer:0, explain:"תוקף = האם הכלי מודד את מה שהוא אמור למדוד (למשל: האם הוא מנבא הצלחה בעבודה — מצגת 5, שקופית 4). ב' וג' מתארים מהימנות נמוכה: חוסר הסכמה בין מעריכים (כמו בין גרפולוגים שונים) וחוסר יציבות לאורך זמן."},
{unit:5, q:"לפניך שלושה משפטים:\nמשפט א': כלי בעל מהימנות גבוהה חייב להיות תקף\nמשפט ב': מהימנות היא תנאי הכרחי אך לא מספק לשימוש בכלי\nמשפט ג': מבדק אמינות הוא בעל תוקף נמוך", options:["משפט א לא נכון, משפט ב נכון, משפט ג לא נכון","משפט א נכון, משפט ב נכון, משפט ג לא נכון","משפט א לא נכון, משפט ב נכון, משפט ג נכון","משפט א נכון, משפט ב נכון, משפט ג נכון"], answer:0, explain:"א' — לא נכון: כלי יכול להיות מהימן (תוצאות עקביות) ועדיין לא תקף (לא מודד את הדבר הנכון). ב' — נכון: בלי מהימנות אין תוקף, אבל מהימנות לבדה לא מספיקה. ג' — לפי המפתח, לא נכון. ⚠️ ההגדרות של תוקף ומהימנות לא מוסברות במצגות מעבר לשקופית הגרפולוגיה (מצגת 5, שקופית 4)."},

/* ===== מצגת 6 ===== */
{unit:6, q:"אחת הסיבות שרצוי לשמר עובדים היא:", options:["מחיר התחלופה מאוד גבוה לארגון","אין סיבה לשמר, זאת שטות","כי פיטורין הוא תהליך יקר","אף תשובה כאן לא נכונה"], answer:0, explain:"מחיר תחלופת עובדים: ישיר (גיוס מחדש), עקיף (חונכים, חפיפה, מורל, טעויות) ומיתוג הארגון (מצגת 6, שקופיות 2 ו-22). וגם במצגת 1: \"לגייס עובד יותר יקר מאשר לשמר עובד\" — אמת."},
{unit:6, q:"אחת הסיבות המרכזיות לכך שארגונים משקיעים משאבים רבים בשימור עובדים הינה העלות הכלכלית העקיפה. מה מהווה דוגמה למונח?", options:["עלות משרד השמה","עלות הכשרת המועמד","עלות פרסום באתרי דרושים","עלות קמפיין חבר מביא חבר"], answer:1, explain:"מחיר כלכלי עקיף: חונכים, מנהלים, זמן חפיפה, מורל, טעויות. חברות השמה ופרסום הן מחיר ישיר (מצגת 6, שקופית 2)."},
{unit:6, q:"אחד מהנושאים הבאים אינו קשור להדרכת אוריינטציה:", options:["רשימה של מושגים ייחודיים לארגון, תעשייה","נהלי בטיחות וחירום","נהלי משמעת כלליים","סדנה של יחסים בינאישיים"], answer:3, explain:"תכני יום הקליטה: מוצרים, נהלים, מבנה ארגוני, קוד אתי, ותכנים רגולטוריים כמו בטיחות וביטחון (מצגת 6, שקופית 9). סדנת יחסים בינאישיים לא מופיעה שם."},
{unit:6, q:"מהי המטרה המרכזית של קיום יום אוריינטציה לעובד חדש המצטרף לארגון?", options:["יצירת היכרות ראשונית עם תרבות הארגון, נהלי העבודה ומבנה החברה","בחינת ביצועיו של העובד לצורך קביעת גובה האחוזים והבונוסים שלו","קבלת החלטה סופית איזה מועמד מתאים מבין המועמדים הסופיים","ניהול משא ומתן על תנאי השכר והסכם ההעסקה של העובד"], answer:0, explain:"אוריינטציה = קליטה מהירה ויעילה במישור המקצועי והחברתי (מצגת 6, שקופית 3); יום הקליטה כולל חזון, נהלים, מבנה ארגוני ותרבות (שקופיות 6 ו-9). בחירת מועמד ומשא ומתן על שכר קורים לפני הקליטה."},
{unit:6, q:"קליטה ארגונית מתייחסת ל:", options:["מידע על זכויות וחובות העובד","השתלבות בצוות","חניכה מקצועית","הקניית ידע לגבי התפקיד"], answer:0, explain:"קליטה ארגונית: הסבר על הארגון, מעמד העובד — זכויותיו וחובותיו, תנאי העסקה. השתלבות בצוות = קליטה חברתית; חניכה והקניית ידע = קליטה מקצועית (מצגת 6, שקופית 7)."},
{unit:6, q:"תחום הרווחה בארגון אינו קשור ל:", options:["שכר העובד","מצב פסיכולוגי של העובד","ארגון אירועים לעובדים","מתן כרטיסים למופעים"], answer:0, explain:"רווחה = \"מערכת הטבות ושירותים הבאים בנוסף לשכר\" (מצגת 6, שקופית 15). ייעוץ פסיכולוגי, אירועים ותרבות ופנאי הם תחומי רווחה (שקופית 17)."},
{unit:6, q:"חברת \"אמזון\" משקיעה משאבים רבים בקיום ימי גיבוש, הדרכות מקצועיות, תוכניות פיתוח עובדים, משוב תקופתי ועידוד מצוינות. למה תורמות פעילויות אלו?", options:["מיתוג מעסיק","אושר ורווחה ארגונית","שימור עובדים","כל התשובות נכונות"], answer:3, explain:"ימי גיבוש = רווחה (מצגת 6, שקופית 17); פיתוח אישי, משוב והצטיינות = אסטרטגיות שימור (שקופיות 23–24); רווחה וקליטה טובה משפרות מיתוג מעסיק (שקופיות 4 ו-16). ⚠️ לשאלה הזו אין תשובה במפתח המבחן (מספור כפול במבחן); התשובה נקבעה לפי המצגות."}

var UNITS = window.__HR_UNITS__ || [];
var EXAMS = window.__HR_EXAMS__ || [];
var OPENQ = window.__HR_OPEN__ || {};
var CROSS = window.__HR_CROSS__ || [];
(window.__HR_GENQ__ || []).forEach(function(m){
  var u = UNITS.filter(function(x){ return x.id === m.unit; })[0];
  if(u){ u.questions.push(m); }
});
(window.__HR_EXAMQ__ || []).forEach(function(m){
  var u = UNITS.filter(function(x){ return x.id === m.unit; })[0];
  if(u){ m.exam = true; u.questions.push(m); }
});


function store(key, val){
  try{
    if(val === undefined) return localStorage.getItem(STORE_PREFIX + key);
    localStorage.setItem(STORE_PREFIX + key, val);
  }catch(e){ return null; }
  return val;
}

var el = function(id){ return document.getElementById(id); };
var homeView, unitView, navList;
var current = null;

/* ---------- מצב תצוגה (נגישות) ---------- */
var THEMES = ["auto","dark","light"];
var THEME_LABELS = {auto:"🌓 אוטומטי", dark:"🌙 מצב כהה", light:"☀️ מצב בהיר"};
function applyTheme(t){
  if(t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  var b = el("themeBtn"); if(b) b.textContent = THEME_LABELS[t];
}
function initTheme(){
  var t = store("theme") || "auto";
  if(THEMES.indexOf(t) < 0) t = "auto";
  applyTheme(t);
  el("themeBtn").addEventListener("click", function(){
    var cur = store("theme") || "auto";
    var next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
    store("theme", next);
    applyTheme(next);
  });
}

document.addEventListener("DOMContentLoaded", function(){
  homeView = el("homeView"); unitView = el("unitView"); navList = el("navList");
  initTheme();
  buildNav();
  renderHome();
  el("menuBtn").addEventListener("click", function(ev){
    ev.stopPropagation();
    if(el("sideNav").classList.contains("open")) closeNav(); else openNav();
  });
  el("navBackdrop").addEventListener("click", closeNav);
  document.addEventListener("keydown", function(ev){ if(ev.key === "Escape") closeNav(); });
});

function buildNav(){
  navList.innerHTML = "";
  var home = document.createElement("div");
  home.className = "nav-item nav-home";
  home.textContent = "🏠 מסך הבית";
  home.addEventListener("click", function(){ renderHome(); closeNav(); });
  navList.appendChild(home);
  UNITS.forEach(function(u){
    var d = document.createElement("div");
    d.className = "nav-item";
    d.id = "nav-u" + u.id;
    var badge = u.questions.length ? "<span class='nv-badge'>" + u.questions.length + " ש'</span>" : "";
    d.innerHTML = "<span>" + u.icon + "</span><span>" + u.id + ". " + u.shortTitle + "</span>" + badge;
    d.addEventListener("click", function(){ openUnit(u.id); closeNav(); });
    navList.appendChild(d);
  });
  if(EXAMS.length){
    var sep = document.createElement("div");
    sep.className = "nav-sep";
    sep.textContent = "🎓 מבחנים מסכמים";
    navList.appendChild(sep);
    EXAMS.forEach(function(ex, i){
      var d = document.createElement("div");
      d.className = "nav-item";
      d.id = "nav-e" + i;
      d.innerHTML = "<span>🎓</span><span>" + ex.title + "</span><span class='nv-badge'>" + ex.questions.length + " ש'</span>";
      d.addEventListener("click", function(){ openExam(i); closeNav(); });
      navList.appendChild(d);
    });
  }
}
function openNav(){ el("sideNav").classList.add("open"); el("navBackdrop").classList.add("show"); document.body.style.overflow = "hidden"; }
function closeNav(){ el("sideNav").classList.remove("open"); el("navBackdrop").classList.remove("show"); document.body.style.overflow = ""; }
function markNav(sel){
  navList.querySelectorAll(".nav-item").forEach(function(it){ it.classList.remove("active"); });
  if(sel){ var t = el(sel); if(t) t.classList.add("active"); }
  else { navList.querySelector(".nav-home").classList.add("active"); }
}

function totalQuestions(){
  return UNITS.reduce(function(s,u){ return s + u.questions.length; }, 0);
}

function renderHome(){
  current = null;
  markNav(null);
  unitView.classList.add("hidden");
  homeView.classList.remove("hidden");
  var html = "";
  var tq = totalQuestions();
  html += "<div class='hero'><h1>👥 גיוס, מיון, הצבה וקליטת עובדים — מערכת לימוד</h1>" +
    "<p>" + (UNITS.length ? UNITS.length + " מצגות עם החומר המלא" + (tq ? " ו-" + tq + " שאלות תרגול" : "") + (EXAMS.length ? ", ובנוסף " + EXAMS.length + " מבחנים לדוגמה" : "") + "." : "המערכת בבנייה — המצגות יתווספו כאן אחת אחרי השנייה.") + "</p>" +
    "<div class='hero-stats'>MA · הלוי ליבת חן</div></div>";
  html += "<h2 style='margin:6px 0 12px;font-size:1.1rem;'>📚 המצגות</h2>";
  if(!UNITS.length) html += "<div class='exam-intro'>⏳ עדיין אין מצגות. כל מצגת שתתווסף תופיע כאן ככרטיס.</div>";
  html += "<div class='cards'>";
  UNITS.forEach(function(u){
    var best = store("unit" + u.id + "_best");
    var bestHtml = best ? "<div class='uc-best'>🏆 שיא: " + best + "% הצלחה</div>" : "";
    html += "<div class='ucard' data-u='" + u.id + "'>" +
      "<div class='uc-icon'>" + u.icon + "</div>" +
      "<h3>מצגת " + u.id + " — " + u.title + "</h3>" +
      "<div class='uc-desc'>" + u.desc + "</div>" +
      "<div class='uc-meta'>📖 החומר המלא" + (u.questions.length ? " · ✍️ " + u.questions.length + " שאלות תרגול" : "") + "</div>" +
      bestHtml + "</div>";
  });
  html += "</div>";
  if(EXAMS.length){
    html += "<h2 style='margin:26px 0 12px;font-size:1.1rem;'>🎓 מבחנים לדוגמה — סימולציית מבחן</h2><div class='cards'>";
    EXAMS.forEach(function(ex, i){
      var best = store("exam" + i + "_best");
      var bestHtml = best ? "<div class='uc-best'>🏆 שיא: " + best + "%</div>" : "";
      html += "<div class='ucard' data-e='" + i + "'>" +
        "<div class='uc-icon'>🎓</div><h3>" + ex.title + "</h3>" +
        "<div class='uc-desc'>" + ex.questions.length + " שאלות בפורמט המבחן. ללא משוב מיידי — ציון והסברים בסוף.</div>" + bestHtml + "</div>";
    });
    html += "</div>";
  }
  html += "<div class='cards' style='margin-top:14px;'>";
  if(CROSS.length){
    html += "<div class='ucard' id='crossCard'><div class='uc-icon'>🧩</div><h3>שאלות מסכמות חוצות-מצגות</h3>" +
      "<div class='uc-desc'>" + CROSS.length + " שאלות שמחברות בין נושאי הקורס.</div></div>";
  }
  html += "</div>";
  homeView.innerHTML = html;
  if(el("crossCard")) el("crossCard").addEventListener("click", openCross);
  homeView.querySelectorAll(".ucard[data-u]").forEach(function(c){
    c.addEventListener("click", function(){ openUnit(parseInt(c.getAttribute("data-u"),10)); });
  });
  homeView.querySelectorAll(".ucard[data-e]").forEach(function(c){
    c.addEventListener("click", function(){ openExam(parseInt(c.getAttribute("data-e"),10)); });
  });
  window.scrollTo(0,0);
}


/* ---------- הדפסה ---------- */
var LETTERS = ["א","ב","ג","ד","ה","ו"];
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>"); }
function printDoc(title, subtitle, summaryHtml, questions, showBadge, openQs){
  var h = "<!DOCTYPE html><html lang='he' dir='rtl'><head><meta charset='utf-8'><title>" + esc(title) + "</title><style>" +
    "@page{margin:15mm;} body{font-family:Arial,'Segoe UI',sans-serif;color:#111;line-height:1.55;font-size:12.5px;margin:0;padding:10px 18px;} " +
    "h1{font-size:20px;margin:0 0 4px;} .sub{color:#555;font-size:12px;margin-bottom:14px;border-bottom:2px solid #333;padding-bottom:8px;} " +
    "h2{font-size:16px;margin:22px 0 8px;border-bottom:1px solid #999;padding-bottom:4px;page-break-after:avoid;} " +
    ".summary h3{font-size:14.5px;margin:14px 0 6px;} .summary h4{font-size:13px;margin:10px 0 4px;} .summary table{border-collapse:collapse;width:100%;margin:8px 0;font-size:11.5px;} " +
    ".summary th,.summary td{border:1px solid #888;padding:4px 6px;vertical-align:top;text-align:right;} .summary th{background:#eee;} " +
    ".summary .hl{border:1px solid #666;background:#f4f4f4;padding:7px 10px;margin:8px 0;border-radius:4px;} .summary ul{padding-right:18px;} " +
    ".q{margin:0 0 12px;page-break-inside:avoid;} .qn{font-weight:700;} .badge{font-size:10px;border:1px solid #b8860b;color:#b8860b;border-radius:3px;padding:0 4px;margin-right:6px;} " +
    ".qt{margin:3px 0 4px;} .opts{padding-right:14px;margin:0;} .opts li{list-style:none;margin:1px 0;} " +
    ".ans{page-break-before:always;} .a{margin:0 0 8px;page-break-inside:avoid;} .a b{color:#0a5;} " +
    ".foot{margin-top:24px;font-size:10px;color:#777;text-align:center;border-top:1px solid #ccc;padding-top:6px;} " +
    "@media print{.noprint{display:none;}}</style></head><body>" +
    "<div class='noprint' style='text-align:center;margin-bottom:12px;'><button onclick='window.print()' style='padding:8px 24px;font-size:14px;cursor:pointer;'>🖨️ הדפסה / שמירה כ-PDF</button></div>" +
    "<h1>" + esc(title) + "</h1><div class='sub'>" + esc(subtitle) + "</div>";
  if(summaryHtml) h += "<h2>📖 סיכום</h2><div class='summary'>" + summaryHtml + "</div>";
  if(questions.length) h += "<h2>✍️ שאלות (" + questions.length + ")</h2>";
  questions.forEach(function(q, i){
    h += "<div class='q'><div class='qn'>שאלה " + (i+1) + (showBadge && q.exam ? " <span class='badge'>שאלה ממבחן לדוגמה</span>" : "") + "</div>" +
      "<div class='qt'>" + esc(q.q) + "</div><ul class='opts'>";
    q.options.forEach(function(o, oi){ h += "<li>" + LETTERS[oi] + ". " + esc(o) + "</li>"; });
    h += "</ul></div>";
  });
  if(questions.length) h += "<h2 class='ans'>✅ דף תשובות</h2>";
  questions.forEach(function(q, i){
    h += "<div class='a'><b>" + (i+1) + ". " + LETTERS[q.answer] + "</b> — " + esc(q.explain || "") + "</div>";
  });
  if(openQs && openQs.length){
    h += "<h2 class='ans'>❓ שאלות פתוחות לחזרה — עם תשובות מודל</h2>";
    openQs.forEach(function(o, i){ h += "<div class='a'><b>" + (i+1) + ". " + esc(o.q) + "</b><br>" + esc(o.a) + "</div>"; });
  }
  h += "<div class='foot'>גיוס, מיון, הצבה וקליטת עובדים · MA · הלוי ליבת חן · Soulware · Taufiq Ibrahim</div></body></html>";
  var w = window.open("", "_blank");
  if(!w){ alert("הדפדפן חסם את חלון ההדפסה — יש לאפשר חלונות קופצים לאתר זה."); return; }
  w.document.open(); w.document.write(h); w.document.close();
  w.focus();
  setTimeout(function(){ try{ w.print(); }catch(e){} }, 500);
}

/* ---------- יחידות ---------- */
function openUnit(id, tab){
  var u = UNITS.filter(function(x){ return x.id === id; })[0];
  if(!u) return;
  current = { unit: u, tab: tab || "summary" };
  markNav("nav-u" + id);
  homeView.classList.add("hidden");
  unitView.classList.remove("hidden");
  renderUnit();
  window.scrollTo(0,0);
}

function renderUnit(){
  var u = current.unit;
  var html = "<div class='unit-head'>" +
    "<button class='back-btn' id='backBtn'>→ חזרה</button>" +
    "<h2>" + u.icon + " מצגת " + u.id + " — " + u.title + "</h2>" +
    "<button class='back-btn print-btn' id='printBtn'>🖨️ הדפסה</button></div>" +
    "<div class='tabs'>" +
    "<button class='tab" + (current.tab==="summary"?" active":"") + "' data-tab='summary'>📖 החומר</button>" +
    (u.questions.length ? "<button class='tab" + (current.tab==="practice"?" active":"") + "' data-tab='practice'>✍️ תרגול (" + u.questions.length + ")</button>" : "") +
    ((OPENQ[u.id]||[]).length ? "<button class='tab" + (current.tab==="open"?" active":"") + "' data-tab='open'>❓ שאלות פתוחות (" + OPENQ[u.id].length + ")</button>" : "") +
    "</div><div id='unitBody'></div>";
  unitView.innerHTML = html;
  el("backBtn").addEventListener("click", function(){ renderHome(); });
  el("printBtn").addEventListener("click", function(){
    printDoc("מצגת " + u.id + " — " + u.title, "החומר המלא" + (u.questions.length ? " + " + u.questions.length + " שאלות תרגול + דף תשובות" : "") + ((OPENQ[u.id]||[]).length ? " + שאלות פתוחות" : ""), u.summary, u.questions, true, OPENQ[u.id] || []);
  });
  unitView.querySelectorAll(".tab").forEach(function(t){
    t.addEventListener("click", function(){
      current.tab = t.getAttribute("data-tab");
      renderUnit();
      window.scrollTo(0,0);
    });
  });
  if(current.tab === "summary") renderSummary();
  else if(current.tab === "open") renderOpen(OPENQ[current.unit.id] || [], el("unitBody"));
  else renderPractice();
}

function renderSummary(){
  var hasQ = current.unit.questions.length > 0;
  var sumHtml = current.unit.summary.replace(/<table>/g, "<div class='tbl-wrap'><table>").replace(/<\/table>/g, "</table></div>");
  el("unitBody").innerHTML = "<div class='summary'>" + sumHtml + "</div>" +
    (hasQ ? "<div style='text-align:center;margin:18px 0;'><button class='retry-btn' id='goPractice'>✍️ מעבר לתרגול המצגת</button></div>" : "");
  if(hasQ) el("goPractice").addEventListener("click", function(){
    current.tab = "practice"; renderUnit(); window.scrollTo(0,0);
  });
}

function renderPractice(){
  var u = current.unit;
  var answered = 0, correct = 0;
  var body = el("unitBody");
  body.innerHTML = "<div class='q-progress'><span id='pAnswered'>נענו 0 מתוך " + u.questions.length + "</span>" +
    "<span id='pScore'>✅ 0 נכונות</span></div><div id='qList'></div><div id='qResult'></div>";
  var list = el("qList");
  u.questions.forEach(function(q, qi){
    var card = document.createElement("div");
    card.className = "q-card";
    var badge = q.exam ? "<span class='q-exam-badge'>🎓 שאלה ממבחן לדוגמה</span>" : "";
    card.innerHTML = "<div class='q-num'>שאלה " + (qi+1) + badge + "</div>" +
      "<div class='q-text'></div><div class='q-opts'></div><div class='q-explain'></div>";
    card.querySelector(".q-text").textContent = q.q;
    var optsWrap = card.querySelector(".q-opts");
    var letters = ["א","ב","ג","ד","ה","ו"];
    q.options.forEach(function(op, oi){
      var b = document.createElement("button");
      b.className = "opt";
      b.textContent = letters[oi] + ". " + op;
      b.addEventListener("click", function(){
        if(card.getAttribute("data-done")) return;
        card.setAttribute("data-done","1");
        answered++;
        var isRight = (oi === q.answer);
        if(isRight) correct++;
        optsWrap.querySelectorAll(".opt").forEach(function(bb, bi){
          bb.disabled = true;
          if(bi === q.answer) bb.classList.add("correct");
          else if(bi === oi && !isRight) bb.classList.add("wrong");
        });
        var exWrap = card.querySelector(".q-explain");
        var cls = isRight ? "ex-ok" : "ex-bad";
        var title = isRight ? "✅ נכון מאוד!" : "❌ לא מדויק. התשובה הנכונה: " + letters[q.answer] + ".";
        exWrap.innerHTML = "<div class='explain " + cls + "'><span class='ex-title'>" + title + "</span> <span class='ex-body'></span></div>";
        exWrap.querySelector(".ex-body").textContent = q.explain || "";
        el("pAnswered").textContent = "נענו " + answered + " מתוך " + u.questions.length;
        el("pScore").textContent = "✅ " + correct + " נכונות";
        if(answered === u.questions.length) finishPractice();
      });
      optsWrap.appendChild(b);
    });
    list.appendChild(card);
  });
  function finishPractice(){
    var pct = Math.round(correct / u.questions.length * 100);
    var best = parseInt(store("unit" + u.id + "_best") || "0", 10);
    if(pct > best) store("unit" + u.id + "_best", String(pct));
    var cls = pct >= 80 ? "result-pass" : "result-mid";
    var msg = pct >= 80 ? "כל הכבוד! שליטה מצוינת בחומר 🎉" :
              pct >= 60 ? "לא רע! כדאי לחזור על הסיכום ולתרגל שוב 💪" :
              "מומלץ לקרוא שוב את הסיכום ולנסות מחדש 📖";
    el("qResult").innerHTML = "<div class='result-banner " + cls + "'>" +
      "סיימת את התרגול: " + correct + "/" + u.questions.length + " (" + pct + "%)<br>" + msg +
      "<br><button class='retry-btn' id='retryBtn'>🔄 תרגול מחדש</button></div>";
    el("retryBtn").addEventListener("click", function(){ renderPractice(); window.scrollTo(0,0); });
    el("qResult").scrollIntoView({behavior:"smooth"});
  }
}

/* ---------- שאלות פתוחות ---------- */
function renderOpen(list, container){
  var h = "<div class='exam-intro'>שאלות פתוחות לבדיקה עצמית. נסו לענות בעצמכם, ואז לחצו על השאלה לחשיפת תשובת המודל.</div>";
  list.forEach(function(o, i){
    h += "<details class='q-card open-q'><summary><span class='q-num'>שאלה " + (i+1) + "</span><div class='q-text'>" + esc(o.q).replace(/<br>/g," ") + "</div></summary>" +
         "<div class='explain ex-ok' style='margin-top:10px;'><span class='ex-title'>💡 תשובת מודל:</span> " + esc(o.a).replace(/<br>/g," ") + "</div></details>";
  });
  container.innerHTML = h;
}
function openCross(){
  current = { cross: true };
  markNav(null);
  homeView.classList.add("hidden");
  unitView.classList.remove("hidden");
  unitView.innerHTML = "<div class='unit-head'><button class='back-btn' id='backBtn'>→ חזרה</button>" +
    "<h2>🧩 שאלות מסכמות חוצות-מצגות</h2><button class='back-btn print-btn' id='printBtn'>🖨️ הדפסה</button></div><div id='unitBody'></div>";
  el("backBtn").addEventListener("click", function(){ renderHome(); });
  el("printBtn").addEventListener("click", function(){
    printDoc("שאלות מסכמות חוצות-מצגות", CROSS.length + " שאלות פתוחות עם תשובות מודל", "", [], false, CROSS);
  });
  renderOpen(CROSS, el("unitBody"));
  window.scrollTo(0,0);
}

/* ---------- מבחנים מסכמים ---------- */
function openExam(i){
  var ex = EXAMS[i];
  if(!ex) return;
  current = { exam: ex, examIndex: i };
  markNav("nav-e" + i);
  homeView.classList.add("hidden");
  unitView.classList.remove("hidden");
  renderExam();
  window.scrollTo(0,0);
}

function renderExam(){
  var ex = current.exam, idx = current.examIndex;
  var n = ex.questions.length;
  var answers = new Array(n).fill(-1);
  var submitted = false;
  var best = store("exam" + idx + "_best");
  var letters = ["א","ב","ג","ד","ה","ו"];

  var html = "<div class='unit-head'>" +
    "<button class='back-btn' id='backBtn'>→ חזרה</button>" +
    "<h2>🎓 " + ex.title + "</h2>" +
    "<button class='back-btn print-btn' id='printBtn'>🖨️ הדפסה</button></div>" +
    "<div class='exam-intro'><b>הוראות (כמו במבחן האמיתי):</b> בכל שאלה מוצגות מספר טענות — יש לסמן את התשובה הנכונה ביותר (אחת בלבד). " +
    "אין משוב מיידי: הציון, התשובות וההסברים יוצגו רק לאחר לחיצה על \"הגשת המבחן\". ניתן לשנות תשובה עד ההגשה." +
    (best ? " · 🏆 השיא שלך במבחן זה: " + best + "%" : "") + "</div>" +
    "<div class='exam-bar'><span id='exCount'>נענו 0 מתוך " + n + "</span>" +
    "<button class='submit-btn' id='submitBtn'>📤 הגשת המבחן</button></div>" +
    "<div id='qList'></div><div id='qResult'></div>";
  unitView.innerHTML = html;
  el("backBtn").addEventListener("click", function(){ renderHome(); });
  el("printBtn").addEventListener("click", function(){
    printDoc(ex.title, n + " שאלות בפורמט המבחן האמיתי · דף תשובות בעמוד האחרון", "", ex.questions, true);
  });

  var list = el("qList");
  ex.questions.forEach(function(q, qi){
    var card = document.createElement("div");
    card.className = "q-card";
    card.id = "exq" + qi;
    var badge = q.exam ? "<span class='q-exam-badge'>🎓 שאלה ממבחן לדוגמה</span>" : "";
    card.innerHTML = "<div class='q-num'>שאלה " + (qi+1) + badge + "</div>" +
      "<div class='q-text'></div><div class='q-opts'></div><div class='q-explain'></div>";
    card.querySelector(".q-text").textContent = q.q;
    var optsWrap = card.querySelector(".q-opts");
    q.options.forEach(function(op, oi){
      var b = document.createElement("button");
      b.className = "opt";
      b.textContent = letters[oi] + ". " + op;
      b.addEventListener("click", function(){
        if(submitted) return;
        answers[qi] = oi;
        optsWrap.querySelectorAll(".opt").forEach(function(bb, bi){
          bb.classList.toggle("sel", bi === oi);
        });
        var c = answers.filter(function(a){ return a >= 0; }).length;
        el("exCount").textContent = "נענו " + c + " מתוך " + n;
      });
      optsWrap.appendChild(b);
    });
    list.appendChild(card);
  });

  el("submitBtn").addEventListener("click", function(){
    if(submitted) return;
    var missing = answers.filter(function(a){ return a < 0; }).length;
    if(missing > 0 && !window.confirm("נותרו " + missing + " שאלות ללא מענה. להגיש בכל זאת?")) return;
    submitted = true;
    el("submitBtn").disabled = true;
    var correct = 0;
    ex.questions.forEach(function(q, qi){
      var card = el("exq" + qi);
      var chosen = answers[qi];
      var isRight = (chosen === q.answer);
      if(isRight) correct++;
      card.querySelectorAll(".opt").forEach(function(bb, bi){
        bb.disabled = true;
        if(bi === q.answer) bb.classList.add("correct");
        else if(bi === chosen && !isRight) bb.classList.add("wrong");
      });
      var exWrap = card.querySelector(".q-explain");
      var cls = isRight ? "ex-ok" : "ex-bad";
      var title = isRight ? "✅ נכון!" : (chosen < 0 ? "⚠️ לא נענתה! התשובה הנכונה: " + letters[q.answer] + "." : "❌ שגוי. התשובה הנכונה: " + letters[q.answer] + ".");
      exWrap.innerHTML = "<div class='explain " + cls + "'><span class='ex-title'>" + title + "</span> <span class='ex-body'></span></div>";
      exWrap.querySelector(".ex-body").textContent = q.explain || "";
    });
    var pct = Math.round(correct / n * 100);
    var prevBest = parseInt(store("exam" + idx + "_best") || "0", 10);
    if(pct > prevBest) store("exam" + idx + "_best", String(pct));
    var cls = pct >= 80 ? "result-pass" : (pct >= 60 ? "result-mid" : "result-fail");
    var msg = pct >= 80 ? "מצוין! אתה מוכן למבחן 🎉" :
              pct >= 60 ? "עברת — אבל שווה לחזק את הנושאים שבהם טעית 💪" :
              "מתחת לציון עובר. חזרו לחומר של המצגות הרלוונטיות ונסו שוב 📖";
    el("qResult").innerHTML = "<div class='result-banner " + cls + "'>" +
      "הציון שלך: " + correct + "/" + n + " — <b>" + pct + "</b><br>" + msg +
      "<br><button class='retry-btn' id='retryBtn'>🔄 ניסיון נוסף</button></div>";
    el("retryBtn").addEventListener("click", function(){ renderExam(); window.scrollTo(0,0); });
    el("qResult").scrollIntoView({behavior:"smooth"});
    window.scrollTo(0,0);
  });
}
})();

</script>
</body>
</html>
